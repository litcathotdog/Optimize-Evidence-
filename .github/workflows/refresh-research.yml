name: Refresh research library

on:
  workflow_dispatch:

  schedule:
    - cron: "17 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: optimize-evidence-pipeline
  cancel-in-progress: false

jobs:
  refresh-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Research Librarian
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DAYS_BACK: "30"
          MAX_RESULTS_PER_TOPIC: "25"
          MAX_TOTAL_PAPERS: "150"
        run: python research_librarian.py

      - name: Run Evidence Appraiser
        run: python evidence_appraiser.py

      - name: Run Statistics Reviewer
        run: python statistics_reviewer.py

      - name: Run Clinical Translator
        run: python clinical_translator.py

      - name: Build Evidence Database
        run: python evidence_database.py

      - name: Route Papers to Specialties
        run: python specialty_router.py

      - name: Run Specialty Reviewers
        run: python specialty_reviewer.py

      - name: Build Knowledge Graph
        run: python knowledge_graph.py

      - name: Generate Journal Club
        run: python journal_club.py

      - name: Export Practitioner Dashboard
        run: python dashboard_export.py

      - name: Commit pipeline results
        run: |
          git config user.name "optimize-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No research updates to commit."
          else
            git commit -m "Refresh and enrich evidence platform"
            git pull --rebase origin main
            git push origin main
          fi
