name: Refresh research library

on:
  workflow_dispatch:

  schedule:
    - cron: "17 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-research-library
  cancel-in-progress: false

jobs:
  refresh-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Research Librarian
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DAYS_BACK: "30"
          MAX_RESULTS_PER_TOPIC: "25"
          MAX_TOTAL_PAPERS: "150"
        run: python research_librarian.py

      - name: Commit updated research
        run: |
          git config user.name "optimize-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/papers.json

          if git diff --cached --quiet; then
            echo "No research updates to commit."
          else
            git commit -m "Refresh evidence library"
            git push
          fi
