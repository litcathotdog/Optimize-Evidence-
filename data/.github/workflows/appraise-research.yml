name: Appraise research evidence

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Refresh research library"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: appraise-research-evidence
  cancel-in-progress: false

jobs:
  appraise-research:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Appraise research
        run: python evidence_appraiser.py

      - name: Commit appraised evidence
        run: |
          git config user.name "optimize-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/appraised_papers.json

          if git diff --cached --quiet; then
            echo "No new appraisals to commit."
          else
            git commit -m "Appraise research evidence"
            git pull --rebase origin main
            git push origin main
          fi
